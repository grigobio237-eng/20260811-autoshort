<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Automation Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-12 font-sans">
    <div class="w-full max-w-3xl px-4">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Shorts Automation Generator
            </h1>
            <p class="text-slate-400">AI를 활용하여 쇼츠 영상을 자동으로 생성하세요.</p>
        </header>

        <!-- Input Section -->
        <main class="bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700">
            <form id="generateForm" class="space-y-6">
                <div class="mb-6">
                    <label for="topic" class="block text-sm font-medium text-slate-300 mb-2">쇼츠 주제 (Topic)</label>
                    <input type="text" id="topic" name="topic" required
                        placeholder="주제를 입력하세요. 예: 유럽 성당 녹색 지붕의 비밀"
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-100 placeholder-slate-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="channelName" class="block text-sm font-medium text-slate-300 mb-2">채널명 (Channel Name)</label>
                        <input type="text" id="channelName" name="channelName" required
                            value="알쓸건잡"
                            placeholder="예: 알쓸건잡"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-100 placeholder-slate-500">
                    </div>
                    <div>
                        <label for="brandName" class="block text-sm font-medium text-slate-300 mb-2">브랜드/협찬사 (Brand)</label>
                        <input type="text" id="brandName" name="brandName"
                            value="광산건설"
                            placeholder="없으면 비워두세요"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-100 placeholder-slate-500">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">영상 포맷 (Format)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer group">
                            <input type="radio" name="format" value="9:16" class="peer sr-only" checked>
                            <div class="p-4 rounded-lg border border-slate-600 bg-slate-900 text-slate-400 group-hover:bg-slate-800 peer-checked:border-blue-500 peer-checked:bg-blue-900/20 peer-checked:text-blue-400 transition-all text-center">
                                <div class="font-semibold mb-1">📱 쇼츠 (Shorts)</div>
                                <div class="text-xs">9:16 세로 화면</div>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="format" value="16:9" class="peer sr-only">
                            <div class="p-4 rounded-lg border border-slate-600 bg-slate-900 text-slate-400 group-hover:bg-slate-800 peer-checked:border-blue-500 peer-checked:bg-blue-900/20 peer-checked:text-blue-400 transition-all text-center">
                                <div class="font-semibold mb-1">🖥️ 유튜브 (YouTube)</div>
                                <div class="text-xs">16:9 가로 화면</div>
                            </div>
                        </label>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn"
                    class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btnText">Generate Shorts</span>
                    <div id="btnLoader" class="loader ml-2 hidden"></div>
                </button>
            </form>

            <!-- Status & Result Section -->
            <div id="resultSection" class="mt-8 hidden">
                <div class="border-t border-slate-700 pt-6">
                    <h2 class="text-lg font-semibold mb-4 text-slate-200">생성 결과</h2>
                    
                    <!-- Status Message -->
                    <div id="statusMessage" class="mb-4 text-sm text-blue-400 flex items-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>요청을 처리하고 있습니다...</span>
                    </div>

                    <!-- Error Box -->
                    <div id="errorBox" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg mb-4 text-sm">
                    </div>

                    <!-- Result Content -->
                    <div id="resultContent" class="hidden bg-slate-900 p-4 rounded-lg border border-slate-700">
                        <p class="text-green-400 font-medium mb-3">✅ 생성이 완료되었습니다!</p>
                        
                        <!-- Video Container -->
                        <div id="videoContainer" class="hidden aspect-video w-full bg-black rounded-lg overflow-hidden mb-4">
                            <video id="resultVideo" controls class="w-full h-full object-contain">
                                <source src="" type="video/mp4">
                                브라우저가 비디오 태그를 지원하지 않습니다.
                            </video>
                        </div>

                        <!-- Script Data Container -->
                        <div id="scriptSection" class="hidden">
                            <label class="block text-sm font-medium text-slate-300 mb-4 mt-4">생성된 기획안 (자유롭게 수정하세요)</label>
                            
                            <!-- 다이나믹 에디터 컨테이너 -->
                            <div id="dynamicEditor" class="w-full h-[600px] overflow-y-auto bg-slate-950 p-4 rounded-md border border-slate-700 space-y-8 custom-scrollbar">
                                <!-- 자바스크립트로 카드가 렌더링 됩니다 -->
                            </div>

                            <!-- Audio Container (2단계 음성 확인용) -->
                            <div id="audioContainer" class="hidden w-full bg-slate-900 p-4 rounded-lg border border-slate-700 mt-6">
                                <label class="block text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2">
                                    <span class="text-xl">🎙️</span> 완성된 AI 내레이션
                                </label>
                                <audio id="resultAudio" controls class="w-full h-12 outline-none">
                                    <source src="" type="audio/mpeg">
                                    브라우저가 오디오 태그를 지원하지 않습니다.
                                </audio>
                            </div>
                            
                            <button type="button" id="proceedBtn" class="mt-6 w-full flex items-center justify-center py-4 px-4 border border-transparent rounded-lg shadow-sm text-base font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <span id="proceedBtnText">✨ 2단계 진행: 음성 및 이미지 생성하기</span>
                                <div id="proceedLoader" class="loader ml-2 hidden border-emerald-300 border-t-white"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEBHOOK_URL = "https://caps-shoe-tribute-schema.trycloudflare.com/webhook/d3e018ca-6f90-4f85-ab56-6283df30a210";
        
        const form = document.getElementById('generateForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const resultSection = document.getElementById('resultSection');
        const statusMessage = document.getElementById('statusMessage');
        const errorBox = document.getElementById('errorBox');
        const resultContent = document.getElementById('resultContent');
        const videoContainer = document.getElementById('videoContainer');
        const resultVideo = document.getElementById('resultVideo');
        const scriptSection = document.getElementById('scriptSection');
        const dynamicEditor = document.getElementById('dynamicEditor');
        const proceedBtn = document.getElementById('proceedBtn');
        const proceedBtnText = document.getElementById('proceedBtnText');
        const proceedLoader = document.getElementById('proceedLoader');

        // n8n Webhook URLs
        const CHECK_STATUS_WEBHOOK_URL = "https://caps-shoe-tribute-schema.trycloudflare.com/webhook/check-script-status";
        const STAGE2_WEBHOOK_URL = "https://caps-shoe-tribute-schema.trycloudflare.com/webhook/stage2-url";

        let statusInterval;
        let pollingInterval;

        // JSON 데이터를 받아 에디터 카드를 그리는 함수
        function renderEditor(data) {
            if (!data || !data.scenes) {
                dynamicEditor.innerHTML = `<div class="text-red-400">올바른 JSON 데이터가 아닙니다.</div>`;
                return;
            }

            let html = `
                <!-- Global Info -->
                <div class="bg-slate-900 p-5 rounded-lg border border-slate-800 shadow-md">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">영상 제목 (Title)</label>
                    <input type="text" id="edit-title" class="w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white mb-5 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" value="${data.title || ''}">
                    
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">핵심 콘셉트 (Concept)</label>
                    <textarea id="edit-concept" class="w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white h-24 focus:ring-2 focus:ring-emerald-500 outline-none transition-all resize-y">${data.concept || ''}</textarea>
                </div>
                
                <div class="flex items-center gap-2 mt-8 mb-4">
                    <div class="h-px bg-slate-800 flex-1"></div>
                    <h3 class="text-lg font-bold text-white px-4">장면 구성 (Scenes)</h3>
                    <div class="h-px bg-slate-800 flex-1"></div>
                </div>
                
                <div id="scenes-container" class="space-y-6">
            `;

            data.scenes.forEach((scene, index) => {
                html += `
                    <div class="scene-card bg-slate-900 p-5 rounded-lg border border-slate-800 shadow-md transition-all hover:border-slate-600" data-scene-num="${scene.scene_number}">
                        <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                            <h4 class="text-emerald-400 font-extrabold text-lg flex items-center gap-2">
                                <span class="bg-emerald-900/50 text-emerald-300 px-2 py-1 rounded text-sm">#${scene.scene_number}</span>
                                컷
                            </h4>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-medium text-slate-400">재생 시간(초):</span>
                                <input type="number" class="scene-duration w-16 bg-slate-950 border border-slate-700 rounded p-1.5 text-white text-center focus:ring-1 focus:ring-emerald-500 outline-none" value="${scene.duration || 2}">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Left Column -->
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span class="text-indigo-400">🎙️</span> 내레이션 대사 (TTS)</label>
                                    <textarea class="scene-tts w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white h-24 focus:ring-2 focus:ring-indigo-500 outline-none transition-all resize-y">${scene.tts_text || ''}</textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span class="text-yellow-400">📝</span> 강조 키워드 (자막)</label>
                                    <input type="text" class="scene-keywords w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-500 outline-none transition-all" value="${scene.highlight_keywords || ''}">
                                </div>
                            </div>
                            
                            <!-- Right Column -->
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span class="text-sky-400">🎬</span> 화면 연출 설명 (한국어)</label>
                                    <textarea class="scene-desc w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white h-24 focus:ring-2 focus:ring-sky-500 outline-none transition-all resize-y">${scene.scene_description || ''}</textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider"><span class="text-purple-400">✨</span> 이미지 프롬프트 (Midjourney)</label>
                                    <textarea class="scene-prompt w-full bg-slate-950 border border-slate-700 rounded-md p-3 text-white h-32 focus:ring-2 focus:ring-purple-500 outline-none transition-all resize-y font-mono text-xs">${scene.image_prompt || ''}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            dynamicEditor.innerHTML = html;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value.trim();
            const channelName = document.getElementById('channelName').value.trim() || '알쓸건잡';
            const brandName = document.getElementById('brandName').value.trim() || '없음';
            const format = document.querySelector('input[name="format"]:checked').value;
            if (!topic) return;

            // UI 초기화 및 로딩 상태 설정
            submitBtn.disabled = true;
            btnText.textContent = "Generating...";
            btnLoader.classList.remove('hidden');
            
            resultSection.classList.remove('hidden');
            statusMessage.classList.remove('hidden');
            errorBox.classList.add('hidden');
            resultContent.classList.add('hidden');
            videoContainer.classList.add('hidden');
            scriptSection.classList.add('hidden');

            const statusTexts = [
                "🔍 수석 리서처가 관련 자료를 조사하고 있습니다...",
                "✍️ 메인 작가가 기발한 대본을 작성하는 중...",
                "🧐 총괄 편집장이 대본을 깐깐하게 검수하고 있습니다...",
                "🎨 비주얼 연출가가 장면(Scene)을 분할하는 중...",
                "거의 다 되었습니다. 프롬프트를 다듬고 있습니다..."
            ];
            
            let statusIndex = 0;
            const statusInterval = setInterval(() => {
                statusIndex = (statusIndex + 1) % statusTexts.length;
                statusMessage.querySelector('span').textContent = statusTexts[statusIndex];
            }, 3000);

            // 1단계 시작 요청: 고유한 주문 번호(Job ID) 생성
            const jobId = 'job_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        topic: topic, 
                        format: format,
                        channelName: channelName,
                        brandName: brandName,
                        jobId: jobId
                    })
                });

                if (!response.ok) {
                    throw new Error(`Webhook Error: ${response.status} ${response.statusText}`);
                }

                // 2단계: 서버 접수 완료. 이제 5초마다 상태 확인(폴링) 시작
                pollingInterval = setInterval(async () => {
                    try {
                        const checkResponse = await fetch(`${CHECK_STATUS_WEBHOOK_URL}?jobId=${jobId}`);
                        if (!checkResponse.ok) return; // 에러 무시하고 5초 뒤 다시 시도
                        
                        const textResult = await checkResponse.text();
                        let data = null;
                        try { data = JSON.parse(textResult); } catch (e) {}

                        // 서버가 processing 중이면 계속 대기
                        if (data && data.status === "processing") {
                            return; 
                        }

                        // 결과 데이터가 드디어 반환됨!
                        clearInterval(pollingInterval);
                        clearInterval(statusInterval);
                        statusMessage.classList.add('hidden');
                        
                        submitBtn.disabled = false;
                        btnText.textContent = "Generate Shorts";
                        btnLoader.classList.add('hidden');
                        
                        resultContent.classList.remove('hidden');

                        if (data && data.scenes) {
                            scriptSection.classList.remove('hidden');
                            renderEditor(data); // 카드 에디터 렌더링
                        } else {
                            scriptSection.classList.remove('hidden');
                            dynamicEditor.innerHTML = `<div class="text-red-400">오류: 데이터 형식이 올바르지 않습니다.<br>${textResult}</div>`;
                        }
                    } catch (pollErr) {
                        console.error("Polling error:", pollErr);
                    }
                }, 5000); // 5초마다 찌르기
                
            } catch (error) {
                clearInterval(statusInterval);
                if (pollingInterval) clearInterval(pollingInterval);
                statusMessage.classList.add('hidden');
                
                errorBox.classList.remove('hidden');
                errorBox.textContent = `오류가 발생했습니다: ${error.message}`;
                
                submitBtn.disabled = false;
                btnText.textContent = "Generate Shorts";
                btnLoader.classList.add('hidden');
            }
        });

        // 2단계 진행 버튼 클릭 이벤트
        proceedBtn.addEventListener('click', async () => {
            // DOM에서 수정된 데이터를 긁어모아 다시 JSON으로 완벽하게 조립합니다.
            try {
                const finalData = {
                    title: document.getElementById('edit-title').value,
                    concept: document.getElementById('edit-concept').value,
                    scenes: []
                };

                document.querySelectorAll('.scene-card').forEach(card => {
                    finalData.scenes.push({
                        scene_number: parseInt(card.dataset.sceneNum),
                        duration: parseInt(card.querySelector('.scene-duration').value),
                        scene_description: card.querySelector('.scene-desc').value,
                        tts_text: card.querySelector('.scene-tts').value,
                        highlight_keywords: card.querySelector('.scene-keywords').value,
                        image_prompt: card.querySelector('.scene-prompt').value
                    });
                });

                proceedBtn.disabled = true;
                proceedBtnText.textContent = "2단계 실행 중...";
                proceedLoader.classList.remove('hidden');
                errorBox.classList.add('hidden');

                // 1. n8n 워크플로우3 (음성 생성) 호출
                const response = await fetch(STAGE2_WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify(finalData)
                });

                if (!response.ok) {
                    throw new Error(`Stage 2 Error: ${response.status} ${response.statusText}`);
                }

                // 2. n8n 워크플로우4 (음성 확인) 주소 생성
                const getVoiceUrl = `https://caps-shoe-tribute-schema.trycloudflare.com/webhook/get-voice?title=${encodeURIComponent(finalData.title)}`;
                
                // 3. 5초마다 파일이 완성되었는지 찔러보기 (Polling)
                let stage2PollingInterval = setInterval(async () => {
                    try {
                        const checkRes = await fetch(getVoiceUrl);
                        const contentType = checkRes.headers.get("content-type");
                        
                        // 만약 n8n이 {"status": "processing"} (JSON)을 돌려줬다면 아직 요리 중이라는 뜻
                        if (contentType && contentType.includes("application/json")) {
                            return; 
                        }
                        
                        // JSON이 아니라면 드디어 MP3 바이너리 파일이 도착한 것입니다!
                        clearInterval(stage2PollingInterval);
                        
                        // 파일을 받아서 브라우저 메모리에 올리고 주소를 만듭니다
                        const blob = await checkRes.blob();
                        const audioUrl = URL.createObjectURL(blob);
                        
                        // 화면 디자인 업데이트
                        proceedBtnText.textContent = "✅ 음성 생성 완료!";
                        proceedLoader.classList.add('hidden');
                        proceedBtn.disabled = false;
                        
                        // 오디오 플레이어에 주소를 넣고 짠! 하고 보여줍니다.
                        const audioPlayer = document.getElementById('resultAudio');
                        const audioContainer = document.getElementById('audioContainer');
                        audioPlayer.src = audioUrl;
                        audioContainer.classList.remove('hidden');
                        
                    } catch (pollErr) {
                        console.error("Audio Polling Error:", pollErr);
                    }
                }, 5000);
                
                
            } catch (error) {
                errorBox.classList.remove('hidden');
                errorBox.textContent = `데이터 전송 오류: ${error.message}`;
            } finally {
                proceedBtn.disabled = false;
                proceedBtnText.textContent = "✨ 2단계 진행: 음성 및 이미지 생성하기";
                proceedLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
